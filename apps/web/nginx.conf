server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets are immutable; the HTML shell never is.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Workbox runtime is content-hashed too.
  location ~* ^/workbox-[^/]+\.js$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Icons and iOS launch images: stable names, so revalidate now and then.
  location ~* ^/(icons|splash)/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Update entry points. If any of these three is cached, a deploy stays
  # invisible to already-installed PWAs — hence no-store, not just no-cache.
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  # No headers added here: the API sets its own (see @fastify/helmet in app.ts),
  # and an add_header at this level would sit on top of them.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA fallback — react-router owns every other path.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
