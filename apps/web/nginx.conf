server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/plain application/javascript application/json application/manifest+json application/xml image/svg+xml;
  gzip_min_length 1024;

  # Every redirect below is same-site. Absolute ones would be built from
  # $scheme, which is http inside the container — so a browser on https got
  # bounced down to http and, behind a proxy that upgrades it again, looped.
  absolute_redirect off;

  error_page 404 /404.html;

  # ---------------------------------------------------------------------------
  # Legal pages. Static files, no JavaScript, no build step — a crawler and a
  # cold phone both get finished HTML on the first response.
  #
  # They use their own headers file: the marketing CSP is tighter than the app's,
  # because these pages load no remote images and talk to nothing.
  # ---------------------------------------------------------------------------

  location = /privacy {
    include /etc/nginx/security-headers-marketing.conf;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files /privacy.html =404;
  }

  location = /termini {
    include /etc/nginx/security-headers-marketing.conf;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files /termini.html =404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/security-headers-marketing.conf;
    add_header Cache-Control "no-store";
  }

  # One URL per page. The .html twins exist on disk and would otherwise be a
  # second, indexable copy of the same content.
  location = /privacy.html { return 301 /privacy; }
  location = /termini.html { return 301 /termini; }

  # The shell is served as a file by the locations at the bottom, so nothing
  # reaches this location except a request that typed the filename. One canonical
  # URL for the app, and no chance of the loop this file had before: try_files
  # with a `=404` fallback serves the file directly instead of re-entering
  # location matching here.
  location = /index.html { return 301 /; }

  # ---------------------------------------------------------------------------
  # Crawler files. Short cache: a sitemap that takes a year to update is worse
  # than no sitemap.
  # ---------------------------------------------------------------------------

  location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    include /etc/nginx/security-headers-marketing.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /og.png {
    include /etc/nginx/security-headers-marketing.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /marketing.css {
    include /etc/nginx/security-headers-marketing.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # ---------------------------------------------------------------------------
  # Static assets, shared by the app and the public pages.
  # ---------------------------------------------------------------------------

  # Hashed assets are immutable; the HTML shell never is.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Workbox runtime is content-hashed too.
  location ~* ^/workbox-[^/]+\.js$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Self-hosted webfonts. The filenames carry family, weight and subset, and the
  # bytes behind a given name never change — a new cut gets a new name.
  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /fonts.css {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Icons and iOS launch images: stable names, so revalidate now and then.
  location ~* ^/(icons|splash)/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Update entry points. If any of these three is cached, a deploy stays
  # invisible to already-installed PWAs — hence no-store, not just no-cache.
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Imported by sw.js at install time (push and notification-click handlers).
  # Its name is not content-hashed, so it gets sw.js's treatment.
  location = /push-sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /favicon.svg {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # ---------------------------------------------------------------------------
  # The API and the app.
  # ---------------------------------------------------------------------------

  # No headers added here: the API sets its own (see @fastify/helmet in app.ts),
  # and an add_header at this level would sit on top of them.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # The single-page app, at the origin root: `start_url` has to be the root for
  # an installed PWA to stay in its standalone window, which is the whole reason
  # the app is not under /app any more.
  location = / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  # Every other route the router answers, spelled out rather than fallen back to.
  # A blanket `try_files $uri /index.html` would hand a 200 and the shell to any
  # typo, and a crawler reads that as a page that exists — the soft 404 the real
  # 404.html was written to avoid. The cost is this list: add a route to
  # src/App.tsx and add it here, or a cold load of it 404s while the same path
  # reached by tapping through the app works.
  #
  # `premium` is not a router route. Stripe builds success_url from APP_URL and
  # returns to /premium/return; the router sends it on to the diary from there.
  location ~ ^/(login|register|onboarding|stats|grocery|add|food|photo-review|entry|weight|profile|notifications|family|scans|join|premium)(/|$) {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  # Bookmarks, push notifications and invite links issued while the app was
  # mounted at /app. Keep until the logs stop showing hits — dropping it early
  # turns every saved link into a 404. $is_args$args because `return` does not
  # carry the query string the way `rewrite` does.
  location = /app { return 301 /; }
  location ~ ^/app/(?<app_path>.*)$ { return 301 /$app_path$is_args$args; }

  # Anything else genuinely does not exist.
  location / {
    include /etc/nginx/security-headers-marketing.conf;
    return 404;
  }
}
