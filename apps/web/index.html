<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is locked: this is an app shell, not a document. Without it iOS
         zooms in on every focused field and never zooms back out, and a stray
         double-tap on the diary leaves the layout half off-screen. Legibility is
         handled by the type scale and the OS text-size setting instead.
         interactive-widget keeps the keyboard from resizing the layout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Calorico — contacalorie italiano con i prodotti del supermercato</title>
    <meta
      name="description"
      content="Calorico è un contacalorie gratuito e open source in italiano: cerchi i prodotti dei supermercati italiani per nome o codice a barre, registri i pasti e vedi calorie e macronutrienti del giorno. Nessuna pubblicità, nessuna rivendita dei dati."
    />
    <meta name="format-detection" content="telephone=no" />
    <!-- This shell is the site: there is no separate landing page. nginx serves
         it on every app route, so the canonical is what keeps a dozen URLs from
         being a dozen copies of one page. Signed out, the page it renders is the
         sign-in screen. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://calorico.davideghiotto.it/" />

    <!-- Link previews. A shared URL is scraped, not rendered, so these tags are
         all a crawler for WhatsApp or LinkedIn ever sees of the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Calorico" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://calorico.davideghiotto.it/" />
    <meta
      property="og:title"
      content="Calorico — contacalorie italiano con i prodotti del supermercato"
    />
    <meta
      property="og:description"
      content="Contacalorie gratuito e open source in italiano. Prodotti Coop, Esselunga, Conad e tabelle CREA, ricerca per nome o codice a barre, calorie e macro del giorno."
    />
    <meta property="og:image" content="https://calorico.davideghiotto.it/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Calorico — diario di calorie e macronutrienti"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Calorico — contacalorie italiano con i prodotti del supermercato"
    />
    <meta
      name="twitter:description"
      content="Contacalorie gratuito e open source in italiano. Prodotti dei supermercati italiani, ricerca per nome o codice a barre, calorie e macro del giorno."
    />
    <meta name="twitter:image" content="https://calorico.davideghiotto.it/og.png" />

    <!-- Status bar colour follows the app background in both schemes. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f5ef"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0f0a"
    />

    <!-- Installed-app behaviour (iOS reads the apple-* variants). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calorico" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />

    <!-- iOS launch images. Sizes are device pixels; the media queries are CSS px. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1284x2778.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1242x2688.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-750x1334.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-2048x2732.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-1668x2388.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/apple-splash-1536x2048.png"
    />

    <!-- Bricolage Grotesque sets the big numbers, Plus Jakarta everything else.
         Both are served from this origin (public/fonts.css): a request to
         fonts.gstatic.com would hand every visitor's IP to Google, which is a
         third-party transfer this app has no reason to make. Preloading the two
         faces the first paint needs keeps the swap from being visible. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bricolage-grotesque-600-800-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-400-latin.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
