<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is locked: this is an app shell, not a document. Without it iOS
         zooms in on every focused field and never zooms back out, and a stray
         double-tap on the diary leaves the layout half off-screen. Legibility is
         handled by the type scale and the OS text-size setting instead.
         interactive-widget keeps the keyboard from resizing the layout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Calorico</title>
    <meta
      name="description"
      content="Calorico — diario di calorie e macronutrienti con i prodotti dei supermercati italiani."
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- Status bar colour follows the app background in both schemes. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f5ef"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0f0a"
    />

    <!-- Installed-app behaviour (iOS reads the apple-* variants). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calorico" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />

    <!-- iOS launch images. Sizes are device pixels; the media queries are CSS px. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/apple-splash-1320x2868.png"
    />

      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
