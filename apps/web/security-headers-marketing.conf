# Security headers for the static pages served outside the app shell: the
# privacy notice, the terms and the 404.
#
# It differs from security-headers.conf by being tighter, not looser: these pages
# ship no script at all, load no remote images and open no connection. There is
# no inline JSON-LD to hash any more — the landing page that carried it is gone,
# and with it `npm run csp:hashes`.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
