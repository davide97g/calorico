# Security headers, included from every location block in nginx.conf.
#
# The include is not decoration: nginx does not merge add_header across levels —
# a location with an add_header of its own drops everything inherited from the
# server block. Every location here sets Cache-Control, so every location has to
# repeat these too.

# Where content may come from. Loose in two places on purpose:
#   style-src   'unsafe-inline' — Radix and Recharts set style attributes
#   img-src     https:          — product photos come from Open Food Facts hosts
#                                 that change without notice
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://*.ingest.de.sentry.io; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The camera is used by the barcode scanner; everything else stays off.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# Traefik terminates TLS. Harmless when it is not.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
