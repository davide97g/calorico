# Production stack for Dokploy.
#
# Dokploy provides the reverse proxy (Traefik) and TLS. Only `web` is routed: it
# joins Traefik's network and the domain points at its port 80. `api` and `db`
# stay on the internal network, and nginx proxies /api to the api container, so
# there is one origin, no CORS and no host port published.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calorico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-calorico}
    volumes:
      - calorico_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-calorico}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-calorico}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calorico}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://calorico.example.com}
      OFF_USER_AGENT: '${OFF_USER_AGENT:-Calorico/0.1 (personal; contact you@example.com)}'
      OFF_ENABLED: ${OFF_ENABLED:-true}
      # Error tracking. Leave unset and Sentry is never initialised.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Meal photos a free account may analyse, for the life of the account.
      FREE_PHOTO_SCANS: ${FREE_PHOTO_SCANS:-1}
      # Stripe. Key, price and webhook secret are needed together; without all
      # three there is no checkout and Premium cannot be bought.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Public URL of the web app: Stripe sends the browser back here.
      APP_URL: ${APP_URL:-https://calorico.example.com}
      # Meal photo analysis. Provider, key and model are needed together;
      # leave them unset and the feature switches itself off.
      VISION_PROVIDER: ${VISION_PROVIDER:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_MAX_IMAGE_BYTES: ${VISION_MAX_IMAGE_BYTES:-1048576}
      VISION_TIMEOUT_MS: ${VISION_TIMEOUT_MS:-30000}
      # Push reminders. Both keys and the contact are needed together; without
      # them the scheduler never starts and the app says notifications are off.
      # Generate a pair with `npm run vapid`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      MAX_REMINDERS_PER_USER: ${MAX_REMINDERS_PER_USER:-12}
      MAX_MEALS_PER_USER: ${MAX_MEALS_PER_USER:-40}
      REMINDER_GRACE_MINUTES: ${REMINDER_GRACE_MINUTES:-10}
      # Where the API reads /version.json to spot a new deploy and notify the
      # devices still on the old build. The service name on the internal network,
      # not the public URL: it never leaves the compose network.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://web}
      RELEASE_NOTICE_DELAY_MINUTES: ${RELEASE_NOTICE_DELAY_MINUTES:-10}
    expose:
      - '3001'
    # /api/ready, not /api/health: a container that cannot reach Postgres must
    # fail its check instead of staying green and erroring on every request.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser DSN, baked into the bundle at build time. Empty = no SDK.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      - api
    # nginx serves the SPA and proxies /api to the api service, so the browser
    # only ever talks to one origin — no CORS, no second domain to configure.
    expose:
      - '80'
    networks:
      # Dokploy's Traefik lives on this external network; without it the domain
      # router can never reach the container (symptom: Traefik default cert, 404).
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true

volumes:
  calorico_pgdata:
